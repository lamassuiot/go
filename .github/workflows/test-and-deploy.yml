name: Test and Deploy the Golang Fork
on:
  push:
  workflow_dispatch:
    inputs:
      go_branch:
        description: "Go release branch to compile"
        type: choice
        required: true
        default: release-branch.go1.27
        options:
          - release-branch.go1.26
          - release-branch.go1.27
jobs:
  test:
    name: Run all.bash
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tests
        run: ./all.bash
        working-directory: src
  build_docker_image:
    name: Build and deploy Docker base image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
          
      - run: |
          echo "SHA1VER=dev-$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Resolve Go branch to compile
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GO_BRANCH="${{ inputs.go_branch }}"
          else
            GO_BRANCH="${{ github.ref_name }}"
          fi
          echo "GO_BRANCH=${GO_BRANCH}" >> $GITHUB_ENV
          echo "GO_TAG=$(echo "${GO_BRANCH}" | sed 's/^release-branch\.//' | tr '/' '-')" >> $GITHUB_ENV

      - name: Login to Github Registry
        uses: docker/login-action@v3 
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/go.dockerfile
          build-args: |
            BASE_IMAGE=alpine:3.14
            SHA1VER=${{ env.SHA1VER }}
            VERSION=latest
            GO_BRANCH=${{ env.GO_BRANCH }}
          tags: |
            ghcr.io/lamassuiot/golang-pqc:latest
            ghcr.io/lamassuiot/golang-pqc:${{ env.GO_TAG }}
          push: true


